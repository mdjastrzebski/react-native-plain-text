name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel runs on main: they gate merges and publish coverage.
  cancel-in-progress: ${{ !contains(github.ref, 'main') }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

      # The C++ under test depends on nothing but the standard library, so the
      # runner's own compiler builds it without a pod install or an NDK.
      - name: Run C++ unit tests
        run: yarn test:cpp

  test-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Robolectric, so no emulator and no NDK. android/ is a standalone Gradle build
      # (android/settings.gradle), so this needs no prebuilt example app.
      - name: Run Android unit tests
        run: yarn test:android

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  vrt-android:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Keep the shared VRT profile intact. Only suppress the emulator window
      # because GitHub-hosted runners have no interactive desktop.
      ANDROID_EMULATOR_HEADLESS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Resolve Android VRT system image
        id: android-vrt-system-image
        shell: bash
        run: |
          source scripts/vrt-config.sh
          IFS=';' read -r package_type api target architecture <<< "$ANDROID_SYSTEM_IMAGE"

          if [[ "$package_type" != "system-images" || -z "$api" || -z "$target" || -z "$architecture" ]]; then
            printf 'Invalid Android system image package: %s\n' "$ANDROID_SYSTEM_IMAGE" >&2
            exit 1
          fi

          printf 'path=%s/system-images/%s/%s/%s\n' \
            "$ANDROID_HOME" "$api" "$target" "$architecture" >> "$GITHUB_OUTPUT"
          printf 'key=android-system-image-v1-%s-%s-%s-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$api" "$target" "$architecture" >> "$GITHUB_OUTPUT"

      - name: Cache Android VRT system image
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.android-vrt-system-image.outputs.path }}
          key: ${{ steps.android-vrt-system-image.outputs.key }}

      # This calls the shared profile, emulator setup, Release build, baseline
      # sync, agent-device capture, and reg-cli comparison used locally.
      - name: Run Android visual regression tests
        run: yarn vrt:android

      - name: Upload Android visual regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-android
          path: |
            build/vrt
            /tmp/react-native-plain-text-vrt-emulator.log
          if-no-files-found: ignore

  vrt-ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Match the Xcode and iOS runtime used to produce the checked-in profile.
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      OPEN_SIMULATOR: 0

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      # This calls the shared profile, simulator setup, Release build, baseline
      # sync, agent-device capture, and reg-cli comparison used locally.
      - name: Run iOS visual regression tests
        run: yarn vrt:ios

      - name: Upload iOS visual regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-ios
          path: build/vrt
          if-no-files-found: ignore

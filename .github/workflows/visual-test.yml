name: Visual Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  # A PR number cannot collide when different forks use the same branch name.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep main and merge-queue runs intact because they gate integration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vrt-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Local Apple Silicon runs retain the arm64 defaults from vrt-config.sh.
      # CI uses the equivalent x86_64 image supported by hosted Linux runners
      # and explicitly compares it with the reviewed cross-ABI baseline.
      VRT_HOST_ARCHITECTURE: x86_64
      ANDROID_API_LEVEL: 36
      ANDROID_AVD_NAME: plaintext_vrt_api36_pixel9_x86_64
      ANDROID_VRT_PROFILE: plaintext_vrt_api36_pixel9_x86_64
      ANDROID_VRT_BASELINE_PROFILE: plaintext_vrt_api36_pixel9_arm64_v8a
      ANDROID_DEVICE_TYPE: pixel_9
      ANDROID_SYSTEM_IMAGE: system-images;android-36;google_apis_playstore;x86_64
      ANDROID_RUNTIME: API 36 Google Play x86_64
      ANDROID_EMULATOR_BUILD: 15917651
      ANDROID_RESOLUTION: 1080x2400
      ANDROID_DENSITY: 420
      ANDROID_FONT_SCALE: 1
      ANDROID_LOCALE: en-US
      ANDROID_TIMEZONE: UTC
      ANDROID_EMULATOR_HEADLESS: 1
      VRT_RESET_DEVICE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Ubuntu 24.04 ships Command-Line Tools 12, whose hardware profile
      # catalog stops at Pixel 7 Pro. The emulator runner uses the existing
      # installation when present, so promote its pinned version before it
      # creates the Pixel 9 AVD.
      - name: Install Android Command-Line Tools 20
        shell: bash
        run: |
          old_tools="$ANDROID_HOME/cmdline-tools/latest"
          new_tools="$ANDROID_HOME/cmdline-tools/20.0"

          "$old_tools/bin/sdkmanager" --install "cmdline-tools;20.0"
          test -x "$new_tools/bin/avdmanager"

          mv "$old_tools" "$ANDROID_HOME/cmdline-tools/runner-12.0"
          mv "$new_tools" "$ANDROID_HOME/cmdline-tools/latest"

          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            list device | grep -A2 '"pixel_9"'

      # GitHub's Linux runners expose /dev/kvm, but the emulator needs explicit
      # access before it can use hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve Android VRT system image
        id: android-vrt-system-image
        shell: bash
        run: |
          source scripts/vrt-config.sh
          IFS=';' read -r package_type api target architecture <<< "$ANDROID_SYSTEM_IMAGE"

          if [[ "$package_type" != "system-images" || -z "$api" || -z "$target" || -z "$architecture" ]]; then
            printf 'Invalid Android system image package: %s\n' "$ANDROID_SYSTEM_IMAGE" >&2
            exit 1
          fi

          printf 'path=%s/system-images/%s/%s/%s\n' \
            "$ANDROID_HOME" "$api" "$target" "$architecture" >> "$GITHUB_OUTPUT"
          printf 'key=android-system-image-v1-%s-%s-%s-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$api" "$target" \
            "$architecture-revision-$ANDROID_SYSTEM_IMAGE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Cache Android VRT system image
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.android-vrt-system-image.outputs.path }}
          key: ${{ steps.android-vrt-system-image.outputs.key }}

      - name: Run Android visual regression tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis_playstore
          arch: x86_64
          profile: ${{ env.ANDROID_DEVICE_TYPE }}
          cores: 4
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          force-avd-creation: true
          emulator-build: ${{ env.ANDROID_EMULATOR_BUILD }}
          emulator-options: >-
            -no-window
            -gpu swiftshader
            -no-metrics
            -no-boot-anim
            -no-snapshot
            -prop persist.sys.locale=${{ env.ANDROID_LOCALE }}
            -skin ${{ env.ANDROID_RESOLUTION }}
            -timezone ${{ env.ANDROID_TIMEZONE }}
            -wipe-data
            -noaudio
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            scripts/configure-android-vrt-device.sh
            scripts/verify-vrt-environment.sh android
            yarn vrt:android run
            yarn vrt:android test

      - name: Upload Android visual regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-android-${{ github.run_attempt }}
          path: |
            build/vrt
            /tmp/react-native-plain-text-vrt-emulator.log
          if-no-files-found: ignore
          retention-days: 7

  vrt-ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      OPEN_SIMULATOR: 0
      VRT_RESET_DEVICE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve iOS VRT cache profile
        id: ios-vrt-cache-profile
        shell: bash
        run: |
          source scripts/vrt-config.sh
          printf 'key=ios-pods-v1-%s-%s-xcode-%s-%s-cocoapods-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$IOS_XCODE_VERSION" \
            "$IOS_XCODE_BUILD" "$(pod --version)" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            example/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.ios-vrt-cache-profile.outputs.key }}-${{ hashFiles('example/ios/Podfile.lock', 'yarn.lock') }}

      # The shared command sets up a clean simulator, builds the Release app,
      # syncs baselines, captures specimens, and runs reg-cli.
      - name: Run iOS visual regression tests
        run: yarn vrt:ios

      - name: Upload iOS visual regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-ios-${{ github.run_attempt }}
          path: build/vrt
          if-no-files-found: ignore
          retention-days: 7

name: Visual Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  # A PR number cannot collide when different forks use the same branch name.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep main and merge-queue runs intact because they gate integration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vrt-android:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The Android baseline is captured on Apple Silicon. Keep CI on the same
      # host architecture so the emulator resolves the arm64-v8a system image.
      - name: Verify Android VRT host architecture
        run: test "$RUNNER_ARCH" = ARM64

      - name: Cache Android VRT SDK and AVD
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .android-sdk
          key: android-vrt-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('emulator.config.json', 'vendor/vrt-android-utils-0.1.0.tgz', 'yarn.lock') }}

      - name: Validate Android emulator configuration
        run: yarn vrt-emulator validate

      - name: Run Android visual regression tests
        run: yarn vrt:android:emulator

      - name: Upload Android visual regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-android-${{ github.run_attempt }}
          path: |
            build/vrt
            .android-sdk/avd/*.log
          if-no-files-found: ignore
          retention-days: 7

  vrt-ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      OPEN_SIMULATOR: 0
      VRT_RESET_DEVICE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve iOS VRT cache profile
        id: ios-vrt-cache-profile
        shell: bash
        run: |
          source scripts/vrt-config.sh
          printf 'key=ios-pods-v1-%s-%s-xcode-%s-%s-cocoapods-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$IOS_XCODE_VERSION" \
            "$IOS_XCODE_BUILD" "$(pod --version)" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            example/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.ios-vrt-cache-profile.outputs.key }}-${{ hashFiles('example/ios/Podfile.lock', 'yarn.lock') }}

      # The shared command sets up a clean simulator, builds the Release app,
      # syncs baselines, captures specimens, and runs reg-cli.
      - name: Run iOS visual regression tests
        run: yarn vrt:ios

      - name: Upload iOS visual regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-ios-${{ github.run_attempt }}
          path: build/vrt
          if-no-files-found: ignore
          retention-days: 7

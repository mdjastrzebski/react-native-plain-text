name: Visual Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

env:
  VRT_ENABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vrt-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      # setup-gradle owns the Gradle User Home cache. The project build cache
      # below is separate and contains generated outputs, including the APK.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate Android project
        run: yarn example expo prebuild --platform android --no-install

      - name: Restore Android build
        id: android-build-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            build/visual-test/android/app-release.apk
            example/android/.gradle
            example/android/build
            example/android/app/build
          key: android-vrt-build-v1-${{ runner.os }}-${{ runner.arch }}-vrt${{ env.VRT_ENABLED }}-api36-emulator15917651-${{ hashFiles('yarn.lock', 'package.json', 'example/package.json', 'example/app.json', 'example/plugins/**', 'example/assets/**', 'src/**', 'android/**', 'ios/**', 'cpp/**') }}
          restore-keys: |
            android-vrt-build-v1-${{ runner.os }}-${{ runner.arch }}-vrt${{ env.VRT_ENABLED }}-api36-emulator15917651-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android VRT emulator
        # android-emulator-runner v2.38.0. All rendering inputs are deliberately
        # inlined here so the workflow has no separate configuration parser.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_9
          cores: 4
          ram-size: 2048M
          heap-size: 512M
          disk-size: 6G
          avd-name: plaintext_vrt_api36_pixel9
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-port: 5554
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -no-metrics -skin 1080x2400
            -prop qemu.vrt.density=420 -prop qemu.vrt.font_scale=1 -wipe-data
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: true
          emulator-build: 15917651
          channel: stable
          script: |
            test "$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/system-images/android-36/google_apis_playstore/x86_64/source.properties")" = 7
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell settings put system font_scale 1
            adb shell settings put system system_locales en-US
            adb shell cmd alarm set-timezone UTC
            if [ '${{ steps.android-build-cache.outputs.cache-hit }}' = 'true' ]; then
              adb install -r build/visual-test/android/app-release.apk
            else
              yarn example android:release --device plaintext_vrt_api36_pixel9 --no-bundler
              mkdir -p build/visual-test/android
              cp example/android/app/build/outputs/apk/release/app-release.apk build/visual-test/android/app-release.apk
            fi
            adb shell pm path plaintext.example

      - name: Save Android build
        if: steps.android-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            build/visual-test/android/app-release.apk
            example/android/.gradle
            example/android/build
            example/android/app/build
          key: ${{ steps.android-build-cache.outputs.cache-primary-key }}

  vrt-ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      IOS_SIMULATOR_NAME: PlainText VRT iOS 26.5
      IOS_RUNTIME_ID: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      IOS_DEVICE_TYPE_ID: com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify Apple toolchain
        run: |
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = 26.5
          test "$(xcodebuild -version | awk 'NR == 2 { print $3 }')" = 17F42
          runtime_build="$(xcrun simctl list runtimes --json \
            | jq -r --arg runtime "$IOS_RUNTIME_ID" \
              '.runtimes[] | select(.identifier == $runtime) | .buildversion')"
          test "$runtime_build" = 23F77

      - name: Generate iOS project
        run: yarn example expo prebuild --platform ios --no-install

      - name: Restore CocoaPods
        id: cocoapods-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            example/ios/Pods
            example/ios/Podfile.lock
            ~/Library/Caches/CocoaPods
          key: ios-vrt-pods-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.5-${{ hashFiles('yarn.lock', 'package.json', 'example/package.json', 'example/app.json', 'example/plugins/**', '*.podspec', 'example/ios/Podfile', 'example/ios/Podfile.properties.json') }}
          restore-keys: |
            ios-vrt-pods-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.5-

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install

      - name: Save CocoaPods
        if: steps.cocoapods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            example/ios/Pods
            example/ios/Podfile.lock
            ~/Library/Caches/CocoaPods
          key: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}

      - name: Create iOS VRT simulator
        run: |
          simulator_udid="$(xcrun simctl create \
            "$IOS_SIMULATOR_NAME" \
            "$IOS_DEVICE_TYPE_ID" \
            "$IOS_RUNTIME_ID")"
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl spawn "$simulator_udid" defaults write NSGlobalDomain AppleLanguages -array en
          xcrun simctl spawn "$simulator_udid" defaults write NSGlobalDomain AppleLocale -string en_US
          xcrun simctl ui "$simulator_udid" appearance light
          xcrun simctl ui "$simulator_udid" content_size large

      - name: Restore iOS build
        id: ios-build-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/visual-test/ios
          key: ios-vrt-build-v1-${{ runner.os }}-${{ runner.arch }}-vrt${{ env.VRT_ENABLED }}-ios26.5-23F77-xcode26.5-17F42-iphone16pro-${{ hashFiles('yarn.lock', 'package.json', 'example/package.json', 'example/app.json', 'example/plugins/**', 'example/assets/**', 'src/**', 'android/**', 'ios/**', 'cpp/**', 'example/ios/Podfile.lock') }}
          restore-keys: |
            ios-vrt-build-v1-${{ runner.os }}-${{ runner.arch }}-vrt${{ env.VRT_ENABLED }}-ios26.5-23F77-xcode26.5-17F42-iphone16pro-

      - name: Build iOS VRT app
        if: steps.ios-build-cache.outputs.cache-hit != 'true'
        run: >-
          yarn example ios:release --device generic --no-bundler
          --output "$GITHUB_WORKSPACE/build/visual-test/ios"

      - name: Save iOS build
        if: steps.ios-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/visual-test/ios
          key: ${{ steps.ios-build-cache.outputs.cache-primary-key }}

      - name: Verify iOS VRT app
        run: |
          ios_app="$(find build/visual-test/ios -type d -name '*.app' -print -quit)"
          test -n "$ios_app"
          xcrun simctl install "$IOS_SIMULATOR_UDID" "$ios_app"
          xcrun simctl launch "$IOS_SIMULATOR_UDID" plaintext.example

      - name: Stop iOS VRT simulator
        if: always() && env.IOS_SIMULATOR_UDID != ''
        run: xcrun simctl shutdown "$IOS_SIMULATOR_UDID"

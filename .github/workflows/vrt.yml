name: Visual Regression Tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        type: choice
        options:
          - all
          - android
          - ios
        default: all
  schedule:
    - cron: '13 23 * * *'

permissions:
  contents: read

env:
  VRT_ENABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vrt-android:
    # Scheduled runs have no inputs, so an empty platform means both.
    if: ${{ inputs.platform != 'ios' }}
    runs-on: ubuntu-24.04
    # A cold run is ~30 minutes, and the e2e stage carries its own retry budget.
    timeout-minutes: 75
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      # Part of every build cache key below. `r7` is ANDROID_SYSTEM_IMAGE_REVISION in
      # scripts/vrt-config.sh, which the emulator action can't pin: bump both together.
      VRT_TOOLCHAIN: api36-google_apis-r7-emulator15917651
      # Cached with the APK so a new fingerprint on the same toolchain rebuilds
      # incrementally.
      VRT_BUILD_CACHE_PATHS: |
        node_modules/.cache/vrt/apps/android
        example/android/.gradle
        example/android/build
        example/android/app/build
      VRT_REPORT_PATHS: |
        .vrt/report
        .vrt/actual
        .vrt/environment
        .vrt/devices
        .vrt/emulator
        .vrt/agent-device

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The same function `yarn vrt android install` uses to reject a stale artifact.
      # Hashing files here too would let the two drift, and a cache hit that then
      # failed that check couldn't be fixed from the branch.
      - name: Compute VRT app fingerprint
        id: fingerprint
        run: printf 'fingerprint=%s\n' "$(./scripts/vrt-app-state.sh fingerprint android)" >> "$GITHUB_OUTPUT"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      # setup-gradle caches Gradle User Home; the build cache below holds project
      # outputs, including the APK.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate Android project
        run: yarn example expo prebuild --platform android --no-install

      # Nightly runs only look the key up and always build from scratch: an app
      # restored under a matching fingerprint can pass on code it wasn't built from,
      # which the nightly is there to catch. A key the lookup misses still gets saved.
      - name: Restore Android build
        id: android-build-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          lookup-only: ${{ github.event_name == 'schedule' }}
          path: ${{ env.VRT_BUILD_CACHE_PATHS }}
          key: vrt-android-build-v4-${{ runner.os }}-${{ runner.arch }}-vrt${{ env.VRT_ENABLED }}-${{ env.VRT_TOOLCHAIN }}-${{ steps.fingerprint.outputs.fingerprint }}
          restore-keys: |
            vrt-android-build-v4-${{ runner.os }}-${{ runner.arch }}-vrt${{ env.VRT_ENABLED }}-${{ env.VRT_TOOLCHAIN }}-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK command-line tools
        run: |
          archive="$RUNNER_TEMP/command-line-tools.zip"
          extracted="$RUNNER_TEMP/command-line-tools"
          tools_root="$ANDROID_HOME/cmdline-tools"

          curl --fail --location --silent --show-error \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' \
            --output "$archive"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$archive" \
            | sha256sum --check --status
          mkdir -p "$extracted" "$tools_root"
          unzip -q "$archive" -d "$extracted"
          mv "$extracted/cmdline-tools" "$tools_root/latest"
          "$tools_root/latest/bin/avdmanager" list device \
            | grep -Eq 'id: [0-9]+ or "pixel_9"'

      - name: Start Android VRT emulator
        # android-emulator-runner v2.38.0. Rendering inputs are inlined on purpose, so
        # there is no config parser. The build runs here because the Expo release build
        # needs the booted AVD.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_9
          cores: 4
          ram-size: 2048M
          heap-size: 512M
          disk-size: 6G
          avd-name: plaintext_vrt_api36_pixel9
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-port: 5554
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -no-metrics -skin 1080x2400 -wipe-data
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: true
          emulator-build: 15917651
          channel: stable
          # The action runs `script:` line by line through `sh`, so orchestration lives in
          # a bash file.
          script: ANDROID_BUILD_CACHE_HIT='${{ steps.android-build-cache.outputs.cache-hit == 'true' && github.event_name != 'schedule' }}' ./scripts/run-vrt-android-ci.sh

      # Saved even when a later stage failed, so a capture flake keeps the fresh
      # build. The gate stops a run without a valid APK from caching an empty or
      # stale one.
      - name: Check Android VRT build artifact
        id: android-artifact
        if: ${{ !cancelled() && steps.android-build-cache.outputs.cache-hit != 'true' }}
        run: |
          if [ -f node_modules/.cache/vrt/apps/android/app-release.apk ] &&
            ./scripts/vrt-app-state.sh verify-artifact android; then
            printf 'present=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'present=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Save Android build
        if: ${{ !cancelled() && steps.android-artifact.outputs.present == 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.VRT_BUILD_CACHE_PATHS }}
          key: ${{ steps.android-build-cache.outputs.cache-primary-key }}

      - name: Upload Android VRT results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-android-${{ github.run_attempt }}
          # Not node_modules/.cache/vrt/apps: the cached APK does not belong in the report.
          path: ${{ env.VRT_REPORT_PATHS }}
          if-no-files-found: ignore
          # Everything lives under .vrt/, which the action skips by default.
          include-hidden-files: true
          retention-days: 7

  vrt-ios:
    if: ${{ inputs.platform != 'android' }}
    runs-on: macos-26
    # A cold run is ~36 minutes on this runner, ~24 of them xcodebuild.
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      IOS_SIMULATOR_NAME: PlainText VRT iOS 26.5
      IOS_RUNTIME_ID: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      IOS_DEVICE_TYPE_ID: com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro
      VRT_TOOLCHAIN: ios26.5-23F77-xcode26.5-17F42-iphone16pro
      VRT_BUILD_CACHE_PATHS: node_modules/.cache/vrt/apps/ios
      VRT_REPORT_PATHS: |
        .vrt/report
        .vrt/actual
        .vrt/environment
        .vrt/devices
        .vrt/agent-device

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Cache key and staleness check are the same function; see the Android job.
      - name: Compute VRT app fingerprint
        id: fingerprint
        run: printf 'fingerprint=%s\n' "$(./scripts/vrt-app-state.sh fingerprint ios)" >> "$GITHUB_OUTPUT"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify Apple toolchain
        run: |
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = 26.5
          test "$(xcodebuild -version | awk 'NR == 2 { print $3 }')" = 17F42
          runtime_build="$(xcrun simctl list runtimes --json \
            | jq -r --arg runtime "$IOS_RUNTIME_ID" \
              '.runtimes[] | select(.identifier == $runtime) | .buildversion')"
          test "$runtime_build" = 23F77

      - name: Generate iOS project
        run: yarn example expo prebuild --platform ios --no-install

      - name: Restore CocoaPods
        id: cocoapods-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            example/ios/Pods
            example/ios/Podfile.lock
            ~/Library/Caches/CocoaPods
          # Committed inputs only: hashing the generated Podfile files would move the key
          # without the pull request changing.
          key: ios-vrt-pods-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.5-${{ hashFiles('yarn.lock', 'package.json', 'example/package.json', 'example/app.json', 'example/plugins/**', '*.podspec') }}
          restore-keys: |
            ios-vrt-pods-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.5-

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install

      - name: Save CocoaPods
        if: steps.cocoapods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            example/ios/Pods
            example/ios/Podfile.lock
            ~/Library/Caches/CocoaPods
          key: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}

      - name: Create iOS VRT simulator
        run: VRT_RESET_DEVICE=1 yarn vrt ios setup

      # Nightly runs always build from scratch; see the Android job.
      - name: Restore iOS build
        id: ios-build-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          lookup-only: ${{ github.event_name == 'schedule' }}
          path: ${{ env.VRT_BUILD_CACHE_PATHS }}
          key: vrt-ios-build-v4-${{ runner.os }}-${{ runner.arch }}-vrt${{ env.VRT_ENABLED }}-${{ env.VRT_TOOLCHAIN }}-${{ steps.fingerprint.outputs.fingerprint }}
          restore-keys: |
            vrt-ios-build-v4-${{ runner.os }}-${{ runner.arch }}-vrt${{ env.VRT_ENABLED }}-${{ env.VRT_TOOLCHAIN }}-

      - name: Build iOS VRT app
        if: steps.ios-build-cache.outputs.cache-hit != 'true' || github.event_name == 'schedule'
        run: yarn vrt ios build

      # Same save gate as the Android job.
      - name: Check iOS VRT build artifact
        id: ios-artifact
        if: ${{ !cancelled() && steps.ios-build-cache.outputs.cache-hit != 'true' }}
        run: |
          if [ -d node_modules/.cache/vrt/apps/ios/PlainTextExample.app ] &&
            ./scripts/vrt-app-state.sh verify-artifact ios; then
            printf 'present=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'present=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Save iOS build
        if: ${{ !cancelled() && steps.ios-artifact.outputs.present == 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.VRT_BUILD_CACHE_PATHS }}
          key: ${{ steps.ios-build-cache.outputs.cache-primary-key }}

      - name: Run iOS VRT
        run: |
          yarn vrt ios install
          yarn vrt ios e2e
          yarn vrt ios capture
          yarn vrt ios compare

      - name: Upload iOS VRT results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-ios-${{ github.run_attempt }}
          # Not node_modules/.cache/vrt/apps: the cached app bundle does not belong in the report.
          path: ${{ env.VRT_REPORT_PATHS }}
          if-no-files-found: ignore
          # Everything lives under .vrt/, which the action skips by default.
          include-hidden-files: true
          retention-days: 7

      - name: Stop iOS VRT simulator
        if: always()
        run: |
          if [ -f .vrt/devices/ios-udid ]; then
            xcrun simctl shutdown "$(cat .vrt/devices/ios-udid)"
          fi

- launchApp:
    clearState: true

- assertTrue:
    condition: ${VRT_PROFILE != null && VRT_PROFILE.length > 0}
    label: VRT_PROFILE identifies the baseline environment

- evalScript: ${output.profile = VRT_PROFILE}


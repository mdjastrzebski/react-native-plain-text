- evalScript: ${output.captureIndex = 0}

# A prior run can leave the mounted tab's ScrollView below its first specimen.
# Establish the starting edge before the capture loop, whose traversal is
# intentionally one-way from top to bottom.
- scrollUntilVisible:
    element:
      id: ${JSON.parse(output.captureIds)[0]}
    direction: UP
    timeout: 15000
    speed: 60
    waitToSettleTimeoutMs: 500
    visibilityPercentage: 100
    centerElement: true

- repeat:
    while:
      true: ${output.captureIndex < JSON.parse(output.captureIds).length}
    commands:
      - scrollUntilVisible:
          element:
            id: ${JSON.parse(output.captureIds)[output.captureIndex]}
          direction: DOWN
          timeout: 15000
          speed: 60
          waitToSettleTimeoutMs: 500
          visibilityPercentage: 100
          centerElement: true
      - extendedWaitUntil:
          visible:
            id: ${JSON.parse(output.captureIds)[output.captureIndex]}
          timeout: 15000
      - takeScreenshot:
          path: ${'actual/' + maestro.platform + '/' + output.profile + '/' + JSON.parse(output.captureIds)[output.captureIndex]}
          cropOn:
            id: ${JSON.parse(output.captureIds)[output.captureIndex] + '-text'}
          label: ${'Capture ' + JSON.parse(output.captureIds)[output.captureIndex]}
      - evalScript: ${output.captureIndex++}


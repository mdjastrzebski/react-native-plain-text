buildscript {
  ext.PlainText = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return PlainText[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
    // Standalone build (see settings.gradle): this module is its own root project, so
    // nothing above it has put React Native's plugin on the classpath yet. In an app
    // build the app's root project does, and substitutes the version.
    if (project == project.rootProject) {
      classpath "com.facebook.react:react-native-gradle-plugin"
    }
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

// Only a source checkout has android/src/test; the npm package strips it. Gating test
// config off it avoids AGP failing testDebugUnitTest on an empty source set in consumers.
def hasAndroidTests = file("src/test").isDirectory()

android {
  namespace "com.mdjstack.plaintext"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  if (hasAndroidTests) {
    // Robolectric needs the merged manifest and resources, not a stub R.
    testOptions {
      unitTests.includeAndroidResources = true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  if (hasAndroidTests) {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
  }
}
